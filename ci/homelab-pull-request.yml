# GitHub App pull_request checks. CircleCI project config must be pinned to trusted main;
# see handoff prerequisites. This file never consumes custom webhook metadata.
version: 2.1

commands:
  verify-live-pr-head:
    steps:
      - run:
          name: Verify trusted config and live pull request head
          command: |
            set -euo pipefail
            [[ "$CONFIG_REF" == "refs/heads/main" ]] || {
              echo "CircleCI config must come from refs/heads/main; got $CONFIG_REF" >&2
              exit 1
            }
            [[ "$PR_BASE_REF" == main ]]
            [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
            [[ "$PR_HEAD_SHA" =~ ^[a-f0-9]{40}$ ]]
            [[ "$PIPELINE_REVISION" == "$PR_HEAD_SHA" ]] || {
              echo "Pipeline revision $PIPELINE_REVISION does not match PR event head $PR_HEAD_SHA" >&2
              exit 1
            }
            checkout_sha="$(git rev-parse HEAD)"
            [[ "$checkout_sha" == "$PR_HEAD_SHA" ]] || {
              echo "Checkout $checkout_sha does not match PR event head $PR_HEAD_SHA" >&2
              exit 1
            }
            live_head_sha="$(git ls-remote origin "refs/pull/$PR_NUMBER/head" | cut -f1)"
            [[ "$live_head_sha" == "$PR_HEAD_SHA" ]] || {
              echo "Live PR #$PR_NUMBER head $live_head_sha does not match event $PR_HEAD_SHA" >&2
              exit 1
            }
            echo "Verified live GitHub PR #$PR_NUMBER head $PR_HEAD_SHA"

  assert-pr-checkout:
    steps:
      - run:
          name: Assert event head matches checkout
          command: |
            set -euo pipefail
            [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
            [[ "$PR_HEAD_SHA" =~ ^[a-f0-9]{40}$ ]]
            checkout_sha="$(git rev-parse HEAD)"
            [[ "$checkout_sha" == "$PR_HEAD_SHA" ]] || {
              echo "PR event head $PR_HEAD_SHA does not match checkout $checkout_sha" >&2
              exit 1
            }
            echo "Verified PR #$PR_NUMBER checkout at $checkout_sha"

  verify-policy-integrity:
    steps:
      - run:
          name: Refuse pull request changes to security gate policy
          command: |
            set -euo pipefail
            [[ "$PR_BASE_SHA" =~ ^[a-f0-9]{40}$ ]]
            [[ "$PR_BASE_SHA" != "$PR_HEAD_SHA" ]]
            git fetch --no-tags origin "$PR_BASE_SHA"
            git cat-file -e "$PR_BASE_SHA^{commit}"
            policy_paths=(
              scripts/check_repo_shape.py
              infra/cloudflare/ci-router/audit-routing.py
              infra/cloudflare/ci-router/render-checks.py
              infra/cloudflare/ci-router/path-filter.py
              infra/cloudflare/ci-router/workflow-routing.json
              _config/git-hooks/
              governance/config/purity-bypass-rules.json
            )
            if ! git diff --quiet "$PR_BASE_SHA" "$PR_HEAD_SHA" -- "${policy_paths[@]}"; then
              echo 'Security gate policy changed in the pull request; review and land policy separately before this PR can pass.' >&2
              git diff --name-only "$PR_BASE_SHA" "$PR_HEAD_SHA" -- "${policy_paths[@]}" >&2
              exit 1
            fi
            echo 'PR security gate policy matches trusted base.'

jobs:
  pr-head-preflight:
    # Checkout supplies CircleCI's read-only Git credential; only trusted-main
    # commands run here, never code from the checked-out pull request.
    docker:
      - image: node:22.18.0-bookworm
    resource_class: small
    environment:
      PR_NUMBER: << pipeline.event.github.pull_request.number >>
      PR_HEAD_SHA: << pipeline.event.github.pull_request.head.sha >>
      PR_BASE_SHA: << pipeline.event.github.pull_request.base.sha >>
      PR_BASE_REF: << pipeline.event.github.pull_request.base.ref >>
      PIPELINE_REVISION: << pipeline.git.revision >>
      CONFIG_REF: << pipeline.config.ref >>
    steps:
      - checkout
      - verify-live-pr-head
      - verify-policy-integrity

  pr-head-postflight:
    # Repeat the live-head check after all checkout jobs, so a push while
    # expensive scans are running leaves a failing native status check.
    docker:
      - image: node:22.18.0-bookworm
    resource_class: small
    environment:
      PR_NUMBER: << pipeline.event.github.pull_request.number >>
      PR_HEAD_SHA: << pipeline.event.github.pull_request.head.sha >>
      PR_BASE_REF: << pipeline.event.github.pull_request.base.ref >>
      PIPELINE_REVISION: << pipeline.git.revision >>
      CONFIG_REF: << pipeline.config.ref >>
    steps:
      - checkout
      - verify-live-pr-head

  verify-pr:
    docker:
      - image: node:22.18.0-bookworm
    resource_class: small
    environment:
      PR_NUMBER: << pipeline.event.github.pull_request.number >>
      PR_HEAD_SHA: << pipeline.event.github.pull_request.head.sha >>
      PYTHONSAFEPATH: "1"
    steps:
      - checkout
      - assert-pr-checkout
      - run:
          name: Install Verify dependencies
          command: |
            set -euo pipefail
            apt-get update -qq
            apt-get install -y -qq python3 python3-venv zsh shellcheck curl ca-certificates jq
            python3 -m venv /tmp/ci-venv
            echo 'export PATH=/tmp/ci-venv/bin:$PATH' >> "$BASH_ENV"
            pin="$(grep -iE '^PyYAML==' requirements/requirements.txt)"
            test -n "$pin"
            /tmp/ci-venv/bin/pip install --quiet --disable-pip-version-check "$pin"
      - run:
          name: Install Node dependencies
          command: npm ci
      - run:
          name: Run repository tests
          command: npm test
      - run:
          name: Compile tracked Python
          command: git ls-files '*.py' | xargs -r -n1 python3 -m py_compile
      - run:
          name: Check shell syntax
          command: |
            set -euo pipefail
            fail=0
            while IFS= read -r f; do
              [ -f "$f" ] || continue
              if head -1 "$f" | grep -q 'zsh'; then
                zsh -n "$f" || { echo "zsh syntax error: $f"; fail=1; }
              else
                bash -n "$f" || { echo "bash syntax error: $f"; fail=1; }
              fi
            done < <(git ls-files '*.sh')
            exit "$fail"
      - run:
          name: Check repository shape
          command: python3 -I scripts/check_repo_shape.py
      - run:
          name: Verify routing and adapter parity
          command: |
            python3 -I infra/cloudflare/ci-router/audit-routing.py
            python3 -I infra/cloudflare/ci-router/render-checks.py --check

  hook-parity-pr:
    docker:
      - image: node:22.18.0-bookworm
    resource_class: small
    environment:
      PR_NUMBER: << pipeline.event.github.pull_request.number >>
      PR_HEAD_SHA: << pipeline.event.github.pull_request.head.sha >>
      PYTHONSAFEPATH: "1"
    steps:
      - checkout
      - assert-pr-checkout
      - run:
          name: Install hook-parity dependencies
          command: |
            set -euo pipefail
            apt-get update -qq
            apt-get install -y -qq python3 python3-venv zsh shellcheck curl ca-certificates jq
            python3 -m venv /tmp/ci-venv
            echo 'export PATH=/tmp/ci-venv/bin:$PATH' >> "$BASH_ENV"
            pin="$(grep -iE '^PyYAML==' requirements/requirements.txt)"
            test -n "$pin"
            /tmp/ci-venv/bin/pip install --quiet --disable-pip-version-check "$pin"
      - run:
          name: Git hook entrypoint syntax
          command: |
            for f in _config/git-hooks/pre-commit _config/git-hooks/commit-msg \
                     _config/git-hooks/post-commit _config/git-hooks/pre-push; do
              bash -n "$f"
            done
      - run:
          name: Doc architecture and path integrity
          command: bash _config/git-hooks/src/doc-purity-lint.sh
      - run:
          name: Config and YAML structure audit
          command: git ls-files '*.yaml' '*.yml' | xargs -r python3 -I _config/git-hooks/src/config-validator.py
      - run:
          name: Bypass auditor
          command: python3 -I _config/git-hooks/src/bypass-auditor.py --all

  trufflehog-pr:
    docker:
      - image: node:22.18.0-bookworm
    resource_class: small
    environment:
      PR_NUMBER: << pipeline.event.github.pull_request.number >>
      PR_HEAD_SHA: << pipeline.event.github.pull_request.head.sha >>
      PR_BASE_SHA: << pipeline.event.github.pull_request.base.sha >>
    steps:
      - checkout
      - run:
          name: Assert event head and fetch complete history
          command: |
            set -euo pipefail
            [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
            [[ "$PR_HEAD_SHA" =~ ^[a-f0-9]{40}$ ]]
            [[ "$PR_BASE_SHA" =~ ^[a-f0-9]{40}$ ]]
            [[ "$PR_BASE_SHA" != "$PR_HEAD_SHA" ]]
            checkout_sha="$(git rev-parse HEAD)"
            [[ "$checkout_sha" == "$PR_HEAD_SHA" ]] || {
              echo "PR event head $PR_HEAD_SHA does not match checkout $checkout_sha" >&2
              exit 1
            }
            if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
              git fetch --unshallow --no-tags origin
            fi
            [ "$(git rev-parse --is-shallow-repository)" = false ] || {
              echo 'Refusing to scan an incomplete shallow history' >&2
              exit 1
            }
            git fetch --no-tags origin "$PR_BASE_SHA"
            git cat-file -e "$PR_BASE_SHA^{commit}"
      - run:
          name: Install TruffleHog 3.82.13
          command: |
            set -euo pipefail
            curl --fail --silent --show-error --location --max-time 90 \
              https://github.com/trufflesecurity/trufflehog/releases/download/v3.82.13/trufflehog_3.82.13_linux_amd64.tar.gz \
              -o /tmp/trufflehog.tar.gz
            echo 'ef33d3df50362e810855b6b0e055ab98096dbbf9c866470e08664a474436d2d2  /tmp/trufflehog.tar.gz' | sha256sum -c -
            tar -xzf /tmp/trufflehog.tar.gz -C /tmp trufflehog
      - run:
          name: TruffleHog pull-request commit scan
          command: /tmp/trufflehog git file://. --since-commit "$PR_BASE_SHA" --branch "$PR_HEAD_SHA" --results=verified,unknown --fail --no-update

  gitleaks-pr:
    docker:
      - image: node:22.18.0-bookworm
    resource_class: small
    environment:
      PR_NUMBER: << pipeline.event.github.pull_request.number >>
      PR_HEAD_SHA: << pipeline.event.github.pull_request.head.sha >>
      PR_BASE_SHA: << pipeline.event.github.pull_request.base.sha >>
    steps:
      - checkout
      - run:
          name: Assert event head and fetch complete history
          command: |
            set -euo pipefail
            [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
            [[ "$PR_HEAD_SHA" =~ ^[a-f0-9]{40}$ ]]
            [[ "$PR_BASE_SHA" =~ ^[a-f0-9]{40}$ ]]
            [[ "$PR_BASE_SHA" != "$PR_HEAD_SHA" ]]
            checkout_sha="$(git rev-parse HEAD)"
            [[ "$checkout_sha" == "$PR_HEAD_SHA" ]] || {
              echo "PR event head $PR_HEAD_SHA does not match checkout $checkout_sha" >&2
              exit 1
            }
            if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
              git fetch --unshallow --no-tags origin
            fi
            [ "$(git rev-parse --is-shallow-repository)" = false ] || {
              echo 'Refusing to scan an incomplete shallow history' >&2
              exit 1
            }
            git fetch --no-tags origin "$PR_BASE_SHA"
            git cat-file -e "$PR_BASE_SHA^{commit}"
      - run:
          name: Install Gitleaks 8.30.1
          command: |
            set -euo pipefail
            curl --fail --silent --show-error --location --max-time 90 \
              https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
              -o /tmp/gitleaks.tar.gz
            echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz' | sha256sum -c -
            tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
      - run:
          name: Gitleaks pull-request commit scan
          command: |
            set -euo pipefail
            git show "$PR_BASE_SHA:_config/gitleaks.toml" > /tmp/ci-gitleaks.toml
            : > /tmp/ci-gitleaks-ignore
            /tmp/gitleaks git . --redact --no-banner --config /tmp/ci-gitleaks.toml \
              --gitleaks-ignore-path /tmp/ci-gitleaks-ignore --ignore-gitleaks-allow \
              --log-opts "$PR_BASE_SHA..$PR_HEAD_SHA"

  automation-pr:
    docker:
      - image: node:22.18.0-bookworm
    resource_class: small
    environment:
      PR_NUMBER: << pipeline.event.github.pull_request.number >>
      PR_HEAD_SHA: << pipeline.event.github.pull_request.head.sha >>
      PYTHONSAFEPATH: "1"
    steps:
      - checkout
      - assert-pr-checkout
      - run:
          name: Install automation check dependencies
          command: |
            set -euo pipefail
            apt-get update -qq
            apt-get install -y -qq git curl ca-certificates jq python3 python3-venv zsh shellcheck
            python3 -m venv /tmp/ci-venv
            /tmp/ci-venv/bin/pip install --quiet --disable-pip-version-check pyyaml==6.0.3
            echo 'export PATH=/tmp/ci-venv/bin:$PATH' >> "$BASH_ENV"
      - run:
          name: Automation shell syntax parity
          command: |
            set -euo pipefail
            bash -n _config/git-hooks/pre-commit
            bash -n _config/git-hooks/commit-msg
            bash -n _config/git-hooks/post-commit
            bash -n _config/git-hooks/pre-push
            bash -n _config/git-hooks/src/run-hook.sh
            bash -n _config/git-hooks/src/doc-purity-pre-commit.sh
            bash -n _config/git-hooks/src/git-crypt-guard-pre-commit.sh
            bash -n _config/git-hooks/src/commit-msg-check.sh
            bash -n _config/git-hooks/src/secret-scan.sh
            bash -n _config/git-hooks/src/path-scoped-pre-push.sh
            bash -n _config/git-hooks/src/mcp-sync-post-commit.sh
            bash -n _config/git-hooks/src/doc-purity-lint.sh
            bash -n host-jobs/src/environment-updater.sh
      - run:
          name: Repository doc guard parity
          command: bash ./_config/git-hooks/pre-commit

  chezmoi-pr:
    docker:
      - image: node:22.18.0-bookworm
    resource_class: small
    environment:
      PR_NUMBER: << pipeline.event.github.pull_request.number >>
      PR_HEAD_SHA: << pipeline.event.github.pull_request.head.sha >>
    steps:
      - checkout
      - assert-pr-checkout
      - run:
          name: Install chezmoi 2.73.0
          command: |
            set -euo pipefail
            curl --fail --silent --show-error --location --max-time 90 \
              https://github.com/twpayne/chezmoi/releases/download/v2.73.0/chezmoi_2.73.0_linux_amd64.tar.gz \
              -o /tmp/chezmoi.tar.gz
            echo 'b597729b687af4488a848240134cb633de8ca0f04e0d26d48f400ee2ac338ffa  /tmp/chezmoi.tar.gz' | sha256sum -c -
            tar -xzf /tmp/chezmoi.tar.gz -C /tmp chezmoi
      - run:
          name: Chezmoi doctor parity
          command: /tmp/chezmoi --source _config/chezmoi doctor
      - run:
          name: Chezmoi diff parity
          command: /tmp/chezmoi --source _config/chezmoi diff

  layout-lint-pr:
    docker:
      - image: node:22.18.0-bookworm
    resource_class: small
    environment:
      PR_NUMBER: << pipeline.event.github.pull_request.number >>
      PR_HEAD_SHA: << pipeline.event.github.pull_request.head.sha >>
    steps:
      - checkout
      - assert-pr-checkout
      - run:
          name: Filesystem layout naming parity
          command: npm exec --yes --package=@ls-lint/ls-lint@2.3.1 -- ls-lint

  typos-pr:
    docker:
      - image: node:22.18.0-bookworm
    resource_class: small
    environment:
      PR_NUMBER: << pipeline.event.github.pull_request.number >>
      PR_HEAD_SHA: << pipeline.event.github.pull_request.head.sha >>
    steps:
      - checkout
      - assert-pr-checkout
      - run:
          name: Install typos 1.28.3
          command: |
            set -euo pipefail
            curl --fail --silent --show-error --location --max-time 90 \
              https://github.com/crate-ci/typos/releases/download/v1.28.3/typos-v1.28.3-x86_64-unknown-linux-musl.tar.gz \
              -o /tmp/typos.tar.gz
            echo '5aadc7aa163b99f040bcce246172e8c1dda0b6139b2d67d00894b3884233bbfb  /tmp/typos.tar.gz' | sha256sum -c -
            tar -xzf /tmp/typos.tar.gz -C /tmp ./typos
      - run:
          name: Typos check parity
          command: /tmp/typos . --config ./governance/config/_typos.toml

workflows:
  github-app-pull-request:
    # Trusted config source and GitHub App event only; webhook pipelines use
    # their own configs and never satisfy this event contract.
    when: pipeline.event.name == "pull_request" and pipeline.trigger.type == "github_app"
    jobs:
      - pr-head-preflight:
          name: PR Head Preflight (CircleCI)
      - verify-pr:
          name: Verify (CircleCI PR)
          requires:
            - PR Head Preflight (CircleCI)
      - hook-parity-pr:
          name: Hook Parity (CircleCI PR)
          requires:
            - PR Head Preflight (CircleCI)
      - trufflehog-pr:
          name: TruffleHog (CircleCI PR)
          requires:
            - PR Head Preflight (CircleCI)
      - gitleaks-pr:
          name: Gitleaks (CircleCI PR)
          requires:
            - PR Head Preflight (CircleCI)
      - automation-pr:
          name: Automation Surfaces (CircleCI PR)
          requires:
            - PR Head Preflight (CircleCI)
      - chezmoi-pr:
          name: Chezmoi Validation (CircleCI PR)
          requires:
            - PR Head Preflight (CircleCI)
      - layout-lint-pr:
          name: Layout & Structure Linting (CircleCI PR)
          requires:
            - PR Head Preflight (CircleCI)
      - typos-pr:
          name: Typos (CircleCI PR)
          requires:
            - PR Head Preflight (CircleCI)
      - pr-head-postflight:
          name: PR Head Current (CircleCI)
          requires:
            - Verify (CircleCI PR)
            - Hook Parity (CircleCI PR)
            - TruffleHog (CircleCI PR)
            - Gitleaks (CircleCI PR)
            - Automation Surfaces (CircleCI PR)
            - Chezmoi Validation (CircleCI PR)
            - Layout & Structure Linting (CircleCI PR)
            - Typos (CircleCI PR)
