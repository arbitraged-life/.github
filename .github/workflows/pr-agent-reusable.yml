name: '🕵️ Codium PR-Agent (reusable)'

on:
  workflow_call:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  pr-agent:
    name: 'CodiumAI PR-Agent Analysis'
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout repository'
        uses: actions/checkout@v7

      - name: 'Run PR-Agent'
        uses: Codium-ai/pr-agent@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # Optional: can also run via Anthropic if OPENAI_API_KEY is omitted
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
