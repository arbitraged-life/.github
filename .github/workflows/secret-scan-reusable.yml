name: Secret Scan (reusable)

# TruffleHog secret scanning. Pinned to an immutable commit SHA
# (not @main) to avoid CI supply-chain risk. No external token
# required — uses the built-in GITHUB_TOKEN read scope.

on:
  workflow_call:
    inputs:
      harden_runner:
        description: Run step-security/harden-runner first.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  trufflehog:
    name: TruffleHog secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        if: inputs.harden_runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0
      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@20652fbbdefffcdaa493a5bf57ab2ac6b1db715b # v3.97.1
        with:
          extra_args: --results=verified,unknown
